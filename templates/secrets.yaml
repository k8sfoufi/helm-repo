apiVersion: v1
kind: Secret
metadata:
  name: todo-db-secret
type: Opaque
stringData:
  username: {{ .Values.secrets.todoDb.username | quote }}
  password: {{ required "secrets.todoDb.password is required" .Values.secrets.todoDb.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: info-db-secret
type: Opaque
stringData:
  username: {{ .Values.secrets.infoDb.username | quote }}
  password: {{ required "secrets.infoDb.password is required" .Values.secrets.infoDb.password | quote }}
